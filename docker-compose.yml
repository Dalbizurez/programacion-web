version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: django_backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./api:/scrt
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vite_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"
